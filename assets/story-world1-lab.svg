<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#101b3d"/><stop offset="1" stop-color="#263b70"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#314b82"/><stop offset="1" stop-color="#101a38"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#8dfaff" stop-opacity=".32"/><stop offset=".5" stop-color="#3776b9" stop-opacity=".08"/><stop offset="1" stop-color="#d5ffff" stop-opacity=".28"/></linearGradient>
 <linearGradient id="rock" x2="1" y2="1"><stop stop-color="#9da9bb"/><stop offset=".5" stop-color="#48546e"/><stop offset="1" stop-color="#202c4a"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#32baff"/><stop offset="1" stop-color="#b2ffff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="700" fill="url(#wall)"/>
<path d="M0 520H1200V700H0Z" fill="url(#floor)"/>
<g opacity=".65" stroke="#70cfff" fill="none" stroke-width="3"><path d="M0 100H1200M0 150H1200M80 0V520M1120 0V520"/><path d="M0 500L600 420 1200 500" stroke-width="2"/></g>
<g fill="#9cecff" opacity=".8"><circle cx="95" cy="90" r="4"/><circle cx="1100" cy="125" r="4"/><circle cx="1020" cy="300" r="3"/><circle cx="180" cy="350" r="3"/></g>
<g transform="translate(60 115)"><rect width="245" height="300" rx="20" fill="#172b52" stroke="#65dfff" stroke-width="5"/><rect x="18" y="20" width="209" height="130" rx="12" fill="#09152e" stroke="#5bdcff" stroke-width="3"/><path d="M35 120L75 80 105 100 150 45 205 90" fill="none" stroke="#49f4ff" stroke-width="5" filter="url(#glow)"/><g fill="#56eaff"><circle cx="48" cy="185" r="9"/><circle cx="83" cy="185" r="9"/><circle cx="118" cy="185" r="9"/></g><rect x="25" y="220" width="195" height="48" rx="8" fill="#203e70" stroke="#4ccfff" stroke-width="2"/></g>
<!-- central containment platform -->
<ellipse cx="610" cy="565" rx="260" ry="48" fill="#07142e" opacity=".7"/>
<path d="M390 480H830L790 555H430Z" fill="#243f70" stroke="#69dfff" stroke-width="5"/>
<path d="M440 475H780L750 520H470Z" fill="url(#glass)" stroke="#9afaff" stroke-width="4"/>
<ellipse cx="610" cy="475" rx="175" ry="38" fill="#7deeff" opacity=".16" filter="url(#glow)"/>
<!-- meteor -->
<g id="meteor" transform="translate(610 405)">
 <path d="M-110 -20L-83 -82 -25 -105 28 -88 90 -55 112 5 70 72 5 94 -70 65 -115 20Z" fill="url(#rock)" stroke="#a9c6e8" stroke-width="7"/>
 <path d="M-54 -67L-20 -38 -38 2 5 28 32 -5 65 18" fill="none" stroke="#52eaff" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
 <path d="M-20 -38L10 -75M5 28L-15 65M32 -5L70 -55" fill="none" stroke="#b2ffff" stroke-width="4"/>
 <circle cx="0" cy="0" r="18" fill="#8fffff" opacity=".7" filter="url(#glow)"/>
</g>
<!-- articulated robot arm, distinct joints for animation -->
<g id="robot-arm" stroke-linecap="round" stroke-linejoin="round">
 <path d="M990 505L980 355" stroke="#101b35" stroke-width="72"/><path d="M990 505L980 355" stroke="#dcecff" stroke-width="48"/>
 <circle cx="980" cy="355" r="34" fill="#273d68" stroke="#83eaff" stroke-width="8"/>
 <path d="M980 355L865 270" stroke="#e6f2ff" stroke-width="44"/><path d="M980 355L865 270" stroke="#6ceaff" stroke-width="7"/>
 <circle cx="865" cy="270" r="28" fill="#243c69" stroke="#9afaff" stroke-width="8"/>
 <path d="M865 270L760 320" stroke="#e6f2ff" stroke-width="36"/><path d="M865 270L760 320" stroke="#6ceaff" stroke-width="6"/>
 <circle cx="760" cy="320" r="23" fill="#203c69" stroke="#9afaff" stroke-width="7"/>
 <path d="M760 320L720 370" stroke="#dcecff" stroke-width="24"/><path d="M720 370L690 360M720 370L700 395" stroke="#a8faff" stroke-width="12"/>
</g>
<!-- processing machine -->
<g transform="translate(910 80)"><rect width="220" height="145" rx="18" fill="#182b50" stroke="#7deaff" stroke-width="5"/><rect x="18" y="18" width="184" height="75" rx="10" fill="#07152f" stroke="#54dfff" stroke-width="3"/><path d="M35 68H185" stroke="#40eaff" stroke-width="5" filter="url(#glow)"/><circle cx="48" cy="120" r="8" fill="#70ffef"/><circle cx="78" cy="120" r="8" fill="#70ffef"/><circle cx="108" cy="120" r="8" fill="#70ffef"/></g>
<!-- side glass tanks -->
<g transform="translate(350 95)" fill="url(#glass)" stroke="#75eaff" stroke-width="4"><rect width="110" height="245" rx="18"/><path d="M12 170Q55 150 98 170V225H12Z" fill="#55eaff" opacity=".35"/></g>
<g transform="translate(490 95)" fill="url(#glass)" stroke="#75eaff" stroke-width="4"><rect width="110" height="245" rx="18"/><path d="M12 190Q55 160 98 190V225H12Z" fill="#9b7cff" opacity=".35"/></g>
<g fill="#c5f7ff" font-family="Arial,sans-serif" opacity=".85"><text x="75" y="465" font-size="22">ANALYSIS SYSTEM</text><text x="920" y="255" font-size="18">PLANETARY MATERIAL</text></g>
<g stroke="#5deaff" stroke-width="4" fill="none" opacity=".7"><path d="M0 610H1200M0 630H1200"/></g>
</svg>